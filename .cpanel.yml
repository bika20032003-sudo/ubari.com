---
deployment:
  tasks:
    - export DEPLOYPATH=~/public_html/
    - /bin/cp -rf dist/* $DEPLOYPATH 2>/dev/null || true
    - /bin/cp -f dist/.htaccess $DEPLOYPATH 2>/dev/null || true
    - /bin/cp -f dist/.nojekyll $DEPLOYPATH 2>/dev/null || true
    - /bin/cp -f dist/_redirects $DEPLOYPATH 2>/dev/null || true
